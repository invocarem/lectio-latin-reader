<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3ead8" />
    <script>
      (function () {
        var stored = null;
        try { stored = localStorage.getItem("lectio.theme"); } catch (e) {}
        var osDark = false;
        try { osDark = window.matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) {}
        var dark = stored === "dark" || (stored !== "light" && osDark);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#16110a" : "#f3ead8");
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Lectio per cancellos</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
